# .github/workflows/ci.yml
#
# Continuous integration for zsh-smart-complete.
#
# Three jobs, deliberately separated by what they can prove:
#
#   test            the full suite on macOS + Linux. This is the gate.
#   zsh-versions    the same suite on several PACKAGED zsh builds, because much
#                   of this codebase documents behaviour as "measured on zsh
#                   5.9" — a claim that was previously verified on exactly one
#                   build per OS. All three of its cells are red; read that job
#                   before concluding anything about what that means.
#   e2e-advisory    the tmux end-to-end suite. NON-BLOCKING on purpose (see that
#                   job): it asserts on a rendered screen, which no other suite
#                   can do, but it also drives a real terminal with wall-clock
#                   waits, so its flake rate has to be MEASURED before it can be
#                   allowed to turn a good change red.
#
# The suite itself is invoked through tests/run-all.sh, which DISCOVERS
# tests/test-*. The job used to list all twelve files by hand, next to a comment
# admitting that a new test file nobody added there is silently never run.

name: CI & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Zsh Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh sqlite3 fzf

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # zsh ships with macOS; only ensure sqlite3 + fzf are available.
          brew install sqlite fzf 2>/dev/null || true

      - name: Verify Zsh
        run: |
          zsh --version
          which zsh

      - name: Check the generated installer blocks
        run: |
          # install.sh and install-entware.sh each carry one block generated from
          # lib/install/core.sh, and both files are committed because the
          # documented install is `curl … | bash` — there is no build step for a
          # user to trigger. A block that no longer matches its source is there-
          # fore a shipped defect rather than a stale build artifact. The suite
          # covers this too (tests/test-installer-shared.sh); the separate step
          # exists so the failure names the command that fixes it.
          bash tools/build-installers.sh --check

      - name: Run Complete Test Suite
        run: |
          # One command, and it discovers the suites (see the header). Output is
          # captured rather than streamed so a failure can be surfaced TWICE: in
          # this log, and as workflow annotations. The annotations matter because
          # downloading a job log needs authentication, while the annotations of
          # a check run are readable with a plain unauthenticated GET
          # (/repos/{owner}/{repo}/check-runs/{id}/annotations). Without them a
          # failure that only reproduces on one runner is unreadable from
          # outside that runner.
          set -e
          if out="$(./tests/run-all.sh -v 2>&1)"; then
            printf '%s\n' "$out"
            # Publish the tally even on a green run. The assertion counts quoted in
            # README.md and in the release tag message are claims about a measured
            # run, and reading them off a GREEN job means downloading its log --
            # which needs authentication, while annotations do not. Without this,
            # the only way to check those numbers is to run the suite somewhere
            # else and hope the two environments agree.
            printf '::notice::%s\n' "$(printf '%s\n' "$out" | grep '^run-all:' | tail -n 1)"
          else
            printf '%s\n' "$out"
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                printf '::error::%s\n' "$line"
              fi
            done < <(printf '%s\n' "$out" | grep -E 'FAIL|TOTAL|SKIP|env:|run-all:' | tail -n 20)
            exit 1
          fi

  zsh-versions:
    name: Zsh ${{ matrix.image }}
    runs-on: ubuntu-latest
    # Each image brings its own packaged zsh, which is the point:
    #   ubuntu:focal      -> zsh 5.7.1   ubuntu:jammy -> zsh 5.8.1
    #   debian:bookworm   -> zsh 5.9
    #
    # BLOCKING, deliberately, even though all three cells are red right now.
    #
    # What the red actually says, measured 2026-09-26: at v2.3.0 (0fb7ea9) this
    # job split focal+jammy red / bookworm GREEN, and that split was the whole
    # argument — one container image passing while two older ones failed ruled the
    # environment out and left the zsh build as the only variable. bookworm is red
    # too now, at every commit from c14d4bf onward, and all three report only
    # "Process completed with exit code 2" with none of the suite's own lines in
    # the annotations. So the old inference has expired, and the two things this
    # shape is consistent with — a suite that fails assertions, and a suite that
    # never starts — are not yet separated. The step below exists to separate
    # them: rc=2 with no tally is the second one.
    #
    # The job stays red and blocking regardless. A gap on the oldest builds this
    # codebase has never been run on is exactly what it was added to find, and
    # silencing it would put the finding back in the drawer.
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:focal, ubuntu:jammy, debian:bookworm]

    steps:
      - name: Install prerequisites in the container
        run: |
          # Needed BEFORE checkout: the checkout action shells out to git, and
          # it runs inside this container, not on the host.
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git zsh sqlite3
          zsh --version

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Complete Test Suite
        run: |
          # Same trick as the gate job: the log needs authentication to read, the
          # annotations of the check run do not. A red job that nobody can read
          # is just noise, so every failure line goes out twice — once in the
          # log, once as an annotation. The job still fails: the exit code is the
          # suite's own.
          set +e
          out="$(./tests/run-all.sh -v 2>&1)"
          rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            hits="$(printf '%s\n' "$out" | grep -E 'FAIL|TOTAL|SKIP|env:|run-all:' | tail -n 20)"
            if [ -n "$hits" ]; then
              while IFS= read -r line; do
                [ -n "$line" ] && printf '::error::%s\n' "$line"
              done <<< "$hits"
            fi
            # And when the grep found nothing at all. run-all.sh only exits 2 on a
            # usage error, and a shell that cannot parse the script returns 2 before
            # any suite runs -- so there is no FAIL line to quote, and all three
            # container cells have been reporting a bare "exit code 2" for every
            # reader who cannot open the log. Name the rc, the toolchain this
            # container resolved, and the first words of the output; those three
            # distinguish a suite that failed from a suite that never started.
            printf '::error::rc=%s bash=[%s] zsh=[%s] out=[%s]\n' "$rc" \
              "$(bash --version 2>&1 | head -n 1)" \
              "$(zsh --version 2>&1 | head -n 1)" \
              "$(printf '%s' "$out" | tr '\n\t' '  ' | head -c 120)"
          fi
          exit "$rc"

      - name: Report the zsh build this run actually tested
        if: always()
        run: |
          echo "zsh on $(uname -s): $(zsh --version)"

  e2e-advisory:
    name: tmux end-to-end (advisory)
    runs-on: ubuntu-latest
    # NON-BLOCKING. The suite drives a real terminal, so it is the only thing
    # that can see the popup being rendered, a keystroke being eaten, or the
    # screen scrolling under the prompt — all bug classes the unit suites
    # structurally cannot observe (see tests/test-repaint.zsh for why).
    # It is also the only suite that waits on wall-clock timings, so until its
    # flake rate is measured here it must not be allowed to fail a build.
    continue-on-error: true
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh tmux sqlite3 fzf

      - name: Run tmux end-to-end suite
        id: e2e
        run: |
          set +e
          ./tests/e2e-tmux.sh 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          rc=${PIPESTATUS[0]}
          # One annotation line per failure so the result is readable from the
          # API without a job log (same rationale as in the `test` job).
          grep -E 'FAIL|TOTAL|SKIP' "$RUNNER_TEMP/e2e.log" | tail -n 20 | \
            while IFS= read -r line; do
              printf '::warning::%s\n' "$line"
            done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report the advisory verdict
        if: always()
        run: |
          if [ "${{ steps.e2e.outputs.rc }}" = "0" ]; then
            echo "e2e-tmux: green. Candidate for becoming a required check."
          else
            echo "::warning::e2e-tmux failed (rc=${{ steps.e2e.outputs.rc }}) — advisory only, not gating."
          fi
