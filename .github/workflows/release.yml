# .github/workflows/release.yml
#
# Release automation for zsh-smart-complete.
#
# What it does:
#   - On pushing a `v*` tag (e.g. `v2.2.0`), this runs automatically and
#     publishes a GitHub Release whose notes are the multi-language
#     (en / zh-CN / zh-TW / ja / ko) section for that version, extracted
#     from the matching CHANGELOG.<lang>.md files.
#   - It can also be run manually (workflow_dispatch) for a tag that is
#     already pushed — handy for back-filling a release.
#
# No build step: this is a pure shell plugin. GitHub attaches the Source
# code (zip/tar.gz) archives automatically; we only publish the notes.
#
# THE TEST GATE (job: gate)
#   Publishing used to be unconditional: pushing a `v*` tag fired this workflow
#   on its own, with nothing checking that the tagged tree passes its own suite.
#   That is the one mistake a release automation must not make, because the tag
#   is exactly the commit people install from. So `release` now `needs: gate`,
#   and gate checks three things a human can otherwise get wrong on the way out:
#   the suite is green, VERSION matches the tag, and the CHANGELOG has a section
#   for the tag (without it the notes below silently publish as links only).
#
# How to release from GitHub Desktop:
#   1. Bump VERSION, commit, then Repository -> Create Tag... -> e.g. v2.3.0
#   2. Push (the tag is pushed with the branch)
#   3. The workflow fires and the Release page appears on its own.
# For an already-pushed tag (e.g. v2.2.0): go to Actions -> Release Automation
# -> Run workflow -> enter the tag -> Run workflow.

name: Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v2.2.0 (defaults to the pushed tag)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  gate:
    name: Tests + release metadata must pass
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout the tagged tree
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh sqlite3

      - name: Run the full test suite
        run: ./tests/run-all.sh -v

      - name: VERSION must match the tag
        # Nothing else pins these two together, so a release could go out with a
        # VERSION file (and therefore `smart-status`) reporting the previous
        # version. `cat` rather than a version compare: VERSION is one line.
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VER="$(cat VERSION | tr -d '[:space:]')"
          if [ "v$VER" != "$TAG" ]; then
            echo "::error::VERSION says '$VER' but the tag is '$TAG'." >&2
            exit 1
          fi
          echo "VERSION matches the tag: $TAG"

      - name: CHANGELOG must have a section for the tag
        # The notes step below would happily produce links-only notes if the
        # section were missing, and the awk in it cannot report that.
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          for f in CHANGELOG.md CHANGELOG.zh-CN.md CHANGELOG.zh-TW.md \
                   CHANGELOG.ja.md CHANGELOG.ko.md; do
            if ! grep -q "^## \[$TAG\]" "$f"; then
              echo "::error::$f has no '## [$TAG]' section." >&2
              exit 1
            fi
          done
          echo "All five changelogs document $TAG"

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: gate

    steps:
      - name: Resolve tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: Build multi-language release notes
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          REPO="${{ github.repository }}"
          {
            echo "Multi-language release notes — 多语言发布说明"
            echo
            echo "The full notes are inline below (English expanded, others collapsible)."
            echo "Or open the per-language changelog:"
            echo
            echo "- [English](https://github.com/${REPO}/blob/${TAG}/CHANGELOG.md)"
            echo "- [简体中文](https://github.com/${REPO}/blob/${TAG}/CHANGELOG.zh-CN.md)"
            echo "- [繁體中文](https://github.com/${REPO}/blob/${TAG}/CHANGELOG.zh-TW.md)"
            echo "- [日本語](https://github.com/${REPO}/blob/${TAG}/CHANGELOG.ja.md)"
            echo "- [한국어](https://github.com/${REPO}/blob/${TAG}/CHANGELOG.ko.md)"
            echo
            for entry in \
              "CHANGELOG.md:English" \
              "CHANGELOG.zh-CN.md:简体中文 (Simplified Chinese)" \
              "CHANGELOG.zh-TW.md:繁體中文 (Traditional Chinese)" \
              "CHANGELOG.ja.md:日本語 (Japanese)" \
              "CHANGELOG.ko.md:한국어 (Korean)"; do
              f="${entry%%:*}"
              lbl="${entry##*:}"
              open=""
              [ "$f" = "CHANGELOG.md" ] && open=" open"
              echo "<details${open}>"
              echo "<summary>$lbl</summary>"
              echo
              awk -v v="$TAG" '
                $0 ~ "^## \\[" v "\\]" { f=1; next }
                f && /^## \[/ { exit }
                f { print }
              ' "$f"
              echo
              echo "</details>"
              echo
            done
          } > release-body.md
          if [ ! -s release-body.md ]; then
            echo "::error::Failed to build release notes for $TAG" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.tag }}
          tag_name: ${{ steps.meta.outputs.tag }}
          body_path: release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
