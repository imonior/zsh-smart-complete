# .github/workflows/ci.yml
#
# Continuous integration for zsh-smart-complete.
# Runs the full Zsh test suite on a matrix of OS + Zsh combinations so we
# catch regressions across macOS (default zsh) and Linux (packaged zsh).

name: CI & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Zsh Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh sqlite3 fzf

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # zsh ships with macOS; only ensure sqlite3 + fzf are available.
          brew install sqlite fzf 2>/dev/null || true

      - name: Verify Zsh
        run: |
          zsh --version
          which zsh

      - name: Run Complete Test Suite
        run: |
          # Each test file is self-contained: sources its own modules,
          # prints PASS/FAIL/SKIP lines and exits non-zero on failure.
          #
          # Suites run through run_suite so a failure is surfaced TWICE: in this
          # log, and as workflow annotations. The annotations matter because
          # downloading a job log needs authentication, while the annotations of
          # a check run are readable with a plain unauthenticated GET
          # (/repos/{owner}/{repo}/check-runs/{id}/annotations). Without them a
          # failure that only reproduces on one runner is unreadable from
          # outside that runner.
          set -e
          run_suite() {
            local out line
            if out="$("$@" 2>&1)"; then
              printf '%s\n' "$out" | tail -n 2
              return 0
            fi
            printf '%s\n' "$out"
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                printf '::error::%s\n' "$line"
              fi
            done < <(printf '%s\n' "$out" | grep -E 'FAIL|TOTAL|SKIP|env:' | tail -n 15)
            return 1
          }
          run_suite zsh tests/test-config.zsh
          run_suite zsh tests/test-history.zsh
          run_suite zsh tests/test-suggest.zsh
          run_suite zsh tests/test-ranking.zsh
          run_suite zsh tests/test-atuin.zsh
          run_suite zsh tests/test-zle.zsh
          run_suite zsh tests/test-menu.zsh
          run_suite zsh tests/test-integration.zsh
          run_suite zsh tests/test-recent.zsh
          # needs zsh/zpty + zsh/mapfile: drives a real interactive zsh on a
          # pseudo-terminal and asserts on the raw bytes it writes per
          # keystroke. Skips itself (exit 0) when those modules are missing.
          run_suite zsh tests/test-repaint.zsh
          # bash, not zsh: it extracts functions out of install.sh and drives
          # them against throwaway files. Listed explicitly like the rest —
          # a new test file that is not named here is silently never run.
          run_suite bash tests/test-installer-options.sh
