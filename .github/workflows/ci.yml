# .github/workflows/ci.yml
#
# Continuous integration for zsh-smart-complete.
#
# Three jobs, deliberately separated by what they can prove:
#
#   test            the full suite on macOS + Linux. This is the gate.
#   zsh-versions    the same suite on several PACKAGED zsh builds, because much
#                   of this codebase documents behaviour as "measured on zsh
#                   5.9" — a claim that was previously verified on exactly one
#                   build per OS. All three of its cells are red; read that job
#                   before concluding anything about what that means.
#   e2e-advisory    the tmux end-to-end suite. NON-BLOCKING on purpose (see that
#                   job): it asserts on a rendered screen, which no other suite
#                   can do, but it also drives a real terminal with wall-clock
#                   waits, so its flake rate has to be MEASURED before it can be
#                   allowed to turn a good change red.
#
# The suite itself is invoked through tests/run-all.sh, which DISCOVERS
# tests/test-*. The job used to list all twelve files by hand, next to a comment
# admitting that a new test file nobody added there is silently never run.

name: CI & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Zsh Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh sqlite3 fzf

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # zsh ships with macOS; only ensure sqlite3 + fzf are available.
          brew install sqlite fzf 2>/dev/null || true

      - name: Verify Zsh
        run: |
          zsh --version
          which zsh

      - name: Check the generated installer blocks
        run: |
          # install.sh and install-entware.sh each carry one block generated from
          # lib/install/core.sh, and both files are committed because the
          # documented install is `curl … | bash` — there is no build step for a
          # user to trigger. A block that no longer matches its source is there-
          # fore a shipped defect rather than a stale build artifact. The suite
          # covers this too (tests/test-installer-shared.sh); the separate step
          # exists so the failure names the command that fixes it.
          bash tools/build-installers.sh --check

      - name: Run Complete Test Suite
        shell: bash
        run: |
          # One command, and it discovers the suites (see the header). Its output
          # goes to a file so that the annotations can be derived from it
          # afterwards: a failure has to be readable from OUTSIDE the runner,
          # because downloading a job log needs authentication while the
          # annotations of its check run do not
          # (/repos/{owner}/{repo}/check-runs/{id}/annotations). Without them a
          # red that only happens on one platform is not a finding, it is a
          # rumour — and the counts quoted in README.md and in release tags are
          # only checkable this way.
          #
          # The packing itself lives in tools/annotate.sh, shared with the
          # zsh-versions job and covered by tests/test-annotate.sh, because both
          # jobs used to carry their own copy of these pipes and both used to lose
          # part of what they had found. It folds a long field into several
          # annotations at ENTRY boundaries rather than trimming it, and it emits
          # the per-suite tallies on a green run too, so "how many assertions is
          # the README quoting" is answerable from the run that made the claim.
          log="$RUNNER_TEMP/suite.log"
          set +e
          ./tests/run-all.sh -v > "$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          # Always exits 0: the suite's own status is the only verdict here.
          bash tools/annotate.sh "$log"
          exit "$rc"

  zsh-versions:
    name: Zsh ${{ matrix.image }}
    runs-on: ubuntu-latest
    # Each image brings its own packaged zsh, which is the point. The versions
    # below are what each cell's own `zsh --version` reported, not what the
    # distro's package page claims:
    #   ubuntu:focal      -> zsh 5.8      ubuntu:jammy -> zsh 5.8.1
    #   debian:bookworm   -> zsh 5.9
    #
    # BLOCKING, on purpose.
    #
    # These three cells were red for four separate reasons, and three of them were
    # the harness, not the code: the shared stub farm put `opkg` on PATH (see the
    # note in tests/test-installer-sandbox.sh), the awk of a Debian/Ubuntu image is
    # mawk, which does not honour interval expressions, so a document extractor
    # silently extracted nothing and reported green (tools/check-module-globals.sh),
    # and two suites needed tools a minimal image lacks — python3 and `ps`.
    #
    # The fourth was real, and only these cells could show it: on zsh 5.8/5.8.1 the
    # ghost lost its colour because our region_highlight `memo=` marker made those
    # builds parse the entry as having NO attributes at all. Measured as
    # `rh=1 12 none` with 256 colours available, i.e. not a terminfo problem;
    # 5.8's Src/prompt.c breaks out of the attribute scan — before storing the
    # colour — on any byte after a colour token that is not a comma. `memo=` is
    # only understood by 5.9 and later (Src/Zle/zle_refresh.c), so the marker is
    # now written only when the running zsh can carry it. The gate is
    # _smart_display_memo_supported in lib/display/display.zsh.
    #
    # Whether that is the whole story is this run's answer. The job stays blocking
    # either way: a gap on the oldest builds this codebase runs on is exactly what
    # it was added to find, and silencing it puts the finding back in the drawer.
    container:
      image: ${{ matrix.image }}
      env:
        # Minimal container images ship with the C locale, which makes grep and
        # awk choke on the Chinese section headers the suites print. Force a
        # UTF-8-capable locale so the text pipeline sees bytes it can match.
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:focal, ubuntu:jammy, debian:bookworm]

    steps:
      - name: Install prerequisites in the container
        run: |
          # Needed BEFORE checkout: the checkout action shells out to git, and
          # it runs inside this container, not on the host.
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git zsh sqlite3 locales python3 procps ncurses-term
          # python3 and procps are test dependencies, not product ones:
          # tests/test-installer-shared.sh parses the installers with a python
          # script, and the installer sandbox's core-tool farm requires `ps` to
          # promise a fixed tool inventory. ubuntu-latest ships both, so a
          # container missing them fails suites that are otherwise green — the
          # exact host-dependence the sandbox farm exists to remove.
          #
          # ncurses-term is the compiled terminal database. tests/test-repaint.zsh
          # boots its nested session as xterm-256color, which a minimal image does
          # not ship a description of, and zsh writes no colour attribute at all
          # when its terminfo lookup cannot find `setaf`. Install it for that
          # reason, not as a fix for the uncoloured ghost: with this package
          # present focal and jammy still reported 256 colours and still wrote no
          # attribute. That one was the zsh version — see the note above.
          #
          # Minimal images also ship without any locale generated, so the suites'
          # Chinese section headers ("场景 1: …") would be truncated mid-character
          # by grep/awk. Generate the one the job env selects.
          sed -i '/en_US.UTF-8/s/^# //' /etc/locale.gen 2>/dev/null || true
          locale-gen en_US.UTF-8 2>/dev/null || true
          zsh --version

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Complete Test Suite
        id: suite
        shell: bash
        run: |
          # Same as the test job, down to the one implementation of the packing
          # (tools/annotate.sh) and the reason for it: the log needs authentication
          # to read, the annotations of the check run do not. The job still fails:
          # the exit code is the suite's own.
          #
          # The rc is recorded as a step output because the last several reds here
          # said nothing at all: the step exited 2 before its first annotation. Only
          # a script that died before its first command can do that -- a process
          # substitution or herestring is parsed when the shell reaches it, so an
          # unsupported one aborts mid-step and its syntax error lands in the log
          # alone. Plain pipes, and the step after this one reports what survived.
          log="$RUNNER_TEMP/suite.log"
          set +e
          ./tests/run-all.sh -v > "$log" 2>&1
          rc=$?
          cat "$log"
          printf 'rc=%s\n' "$rc" >> "$GITHUB_OUTPUT"
          # Green or red, this names every suite that ran with its own
          # passed/failed pair, and every assertion that failed with its name.
          # Before this existed, a red here reported one assertion out of seven
          # because a `tail -n 5` over a broad grep kept the summary lines -- and
          # two runs came back byte-identical, because nothing was ever read.
          bash tools/annotate.sh "$log"
          exit "$rc"

      - name: Report the zsh build and what the suite step left behind
        if: always()
        shell: bash
        run: |
          # The one step that cannot describe itself is the one that never parsed.
          # So report the rc the suite step recorded -- and, when there is none,
          # report that absence, which is itself the finding: the suite step died
          # before it could say anything, and the job's bare "exit code 2" was the
          # whole of its public statement.
          rc="${{ steps.suite.outputs.rc }}"
          [ -n "$rc" ] || rc=never-recorded
          log="$RUNNER_TEMP/suite.log"
          size=0
          [ -f "$log" ] && size="$(wc -c < "$log" | tr -d ' ')"
          printf '::warning::zsh=%s suite rc=%s log_bytes=%s head=[%s]\n' \
            "$(zsh --version 2>&1 | head -n 1)" "$rc" "$size" \
            "$(head -c 110 "$log" 2>/dev/null | tr '\r\n\t' '  ')"

  e2e-advisory:
    name: tmux end-to-end (advisory)
    runs-on: ubuntu-latest
    # NON-BLOCKING. The suite drives a real terminal, so it is the only thing
    # that can see the popup being rendered, a keystroke being eaten, or the
    # screen scrolling under the prompt — all bug classes the unit suites
    # structurally cannot observe (see tests/test-repaint.zsh for why).
    # It is also the only suite that waits on wall-clock timings, so until its
    # flake rate is measured here it must not be allowed to fail a build.
    continue-on-error: true
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh tmux sqlite3 fzf

      - name: Run tmux end-to-end suite
        id: e2e
        run: |
          set +e
          ./tests/e2e-tmux.sh 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          rc=${PIPESTATUS[0]}
          # One readable annotation per failure, folded at entry boundaries by the
          # same tool the gating jobs use. This step used to pack them with
          # `tail -n 20` over a grep that also matched every PASS and every
          # quoted pane line -- so the 20 slots filled up with noise and the
          # failures themselves were the part that got dropped. The pattern is
          # anchored on purpose: FAIL/SKIP only at a line's own indent, plus the
          # harness's total. --failures never takes a verdict, and this job is
          # advisory anyway, so the rc still goes to the step output below.
          bash tools/annotate.sh --failures warning "E2E RESULT" \
            '^[[:space:]]*(FAIL|SKIP)|E2E TOTAL' "$RUNNER_TEMP/e2e.log"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report the advisory verdict
        if: always()
        run: |
          if [ "${{ steps.e2e.outputs.rc }}" = "0" ]; then
            echo "e2e-tmux: green. Candidate for becoming a required check."
          else
            echo "::warning::e2e-tmux failed (rc=${{ steps.e2e.outputs.rc }}) — advisory only, not gating."
          fi
