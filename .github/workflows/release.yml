# .github/workflows/release.yml
#
# Release automation for zsh-smart-complete.
#
# What it does:
#   - On pushing a `v*` tag (e.g. `v2.2.0`), this runs automatically and
#     publishes a GitHub Release whose notes are the multi-language
#     (en / zh-CN / zh-TW / ja / ko) section for that version, extracted
#     from the matching CHANGELOG.<lang>.md files.
#   - It can also be run manually (workflow_dispatch) for a tag that is
#     already pushed — handy for back-filling a release.
#
# No build step: this is a pure shell plugin. GitHub attaches the Source
# code (zip/tar.gz) archives automatically; we only publish the notes.
#
# How to release from GitHub Desktop:
#   1. Bump VERSION, commit, then Repository -> Create Tag... -> e.g. v2.3.0
#   2. Push (the tag is pushed with the branch)
#   3. The workflow fires and the Release page appears on its own.
# For an already-pushed tag (e.g. v2.2.0): go to Actions -> Release Automation
# -> Run workflow -> enter the tag -> Run workflow.

name: Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v2.2.0 (defaults to the pushed tag)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: Build multi-language release notes
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          REPO="${{ github.repository }}"
          {
            echo "Multi-language release notes — 多语言发布说明"
            echo
            echo "The full notes are inline below (English expanded, others collapsible)."
            echo "Or open the per-language changelog:"
            echo
            echo "- [English](https://github.com/${REPO}/blob/${TAG}/CHANGELOG.md)"
            echo "- [简体中文](https://github.com/${REPO}/blob/${TAG}/CHANGELOG.zh-CN.md)"
            echo "- [繁體中文](https://github.com/${REPO}/blob/${TAG}/CHANGELOG.zh-TW.md)"
            echo "- [日本語](https://github.com/${REPO}/blob/${TAG}/CHANGELOG.ja.md)"
            echo "- [한국어](https://github.com/${REPO}/blob/${TAG}/CHANGELOG.ko.md)"
            echo
            for entry in \
              "CHANGELOG.md:English" \
              "CHANGELOG.zh-CN.md:简体中文 (Simplified Chinese)" \
              "CHANGELOG.zh-TW.md:繁體中文 (Traditional Chinese)" \
              "CHANGELOG.ja.md:日本語 (Japanese)" \
              "CHANGELOG.ko.md:한국어 (Korean)"; do
              f="${entry%%:*}"
              lbl="${entry##*:}"
              open=""
              [ "$f" = "CHANGELOG.md" ] && open=" open"
              echo "<details${open}>"
              echo "<summary>$lbl</summary>"
              echo
              awk -v v="$TAG" '
                $0 ~ "^## \\[" v "\\]" { f=1; next }
                f && /^## \[/ { exit }
                f { print }
              ' "$f"
              echo
              echo "</details>"
              echo
            done
          } > release-body.md
          if [ ! -s release-body.md ]; then
            echo "::error::Failed to build release notes for $TAG" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.tag }}
          tag_name: ${{ steps.meta.outputs.tag }}
          body_path: release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
