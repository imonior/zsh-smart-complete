# .github/workflows/ci.yml
#
# Continuous integration for zsh-smart-complete.
#
# Three jobs, deliberately separated by what they can prove:
#
#   test            the full suite on macOS + Linux. This is the gate.
#   zsh-versions    the same suite on several PACKAGED zsh builds, because much
#                   of this codebase documents behaviour as "measured on zsh
#                   5.9" — a claim that was previously verified on exactly one
#                   build per OS. All three of its cells are red; read that job
#                   before concluding anything about what that means.
#   e2e-advisory    the tmux end-to-end suite. NON-BLOCKING on purpose (see that
#                   job): it asserts on a rendered screen, which no other suite
#                   can do, but it also drives a real terminal with wall-clock
#                   waits, so its flake rate has to be MEASURED before it can be
#                   allowed to turn a good change red.
#
# The suite itself is invoked through tests/run-all.sh, which DISCOVERS
# tests/test-*. The job used to list all twelve files by hand, next to a comment
# admitting that a new test file nobody added there is silently never run.

name: CI & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Zsh Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh sqlite3 fzf

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # zsh ships with macOS; only ensure sqlite3 + fzf are available.
          brew install sqlite fzf 2>/dev/null || true

      - name: Verify Zsh
        run: |
          zsh --version
          which zsh

      - name: Check the generated installer blocks
        run: |
          # install.sh and install-entware.sh each carry one block generated from
          # lib/install/core.sh, and both files are committed because the
          # documented install is `curl … | bash` — there is no build step for a
          # user to trigger. A block that no longer matches its source is there-
          # fore a shipped defect rather than a stale build artifact. The suite
          # covers this too (tests/test-installer-shared.sh); the separate step
          # exists so the failure names the command that fixes it.
          bash tools/build-installers.sh --check

      - name: Run Complete Test Suite
        shell: bash
        run: |
          # One command, and it discovers the suites (see the header). Output is
          # captured rather than streamed so a failure can be surfaced TWICE: in
          # this log, and as workflow annotations. The annotations matter because
          # downloading a job log needs authentication, while the annotations of
          # a check run are readable with a plain unauthenticated GET
          # (/repos/{owner}/{repo}/check-runs/{id}/annotations). Without them a
          # failure that only reproduces on one runner is unreadable from
          # outside that runner.
          #
          # The pipe below used to be `done < <(...)`, and a process substitution
          # is the one construct that can kill a step before it says anything: an
          # unparseable line exits 2 with the message only in the log. Kept as a
          # plain pipe so a red run always reaches its annotations.
          set -e
          if out="$(./tests/run-all.sh -v 2>&1)"; then
            printf '%s\n' "$out"
            # Publish the tally even on a green run. The assertion counts quoted in
            # README.md and in the release tag message are claims about a measured
            # run, and reading them off a GREEN job means downloading its log --
            # which needs authentication, while annotations do not. Without this,
            # the only way to check those numbers is to run the suite somewhere
            # else and hope the two environments agree.
            printf '%s\n' "$out" | grep '^run-all:' | tail -n 1 | \
              while IFS= read -r line; do printf '::notice::%s\n' "$line"; done
          else
            printf '%s\n' "$out"
            # Same packing as the zsh-versions job: name every failing assertion
            # in one annotation and the per-suite tallies in another, so a red on
            # one runner is legible from outside it. run-all -v indents each
            # suite's own output with '| ', which is what separates an assertion
            # line from run-all's own `FAIL rc=` summary.
            printf '%s\n' "$out" \
              | grep -E '\|[[:space:]]+FAIL[[:space:]]' \
              | sed -E 's/^[[:space:]]*\|[[:space:]]+FAIL[[:space:]]+//; s/[[:space:]]+$//' \
              | cut -c1-90 | tr '\n' ';' | \
              { IFS= read -r line; printf '::error::FAILING ASSERTIONS: %s\n' "$line"; }
            printf '%s\n' "$out" | grep -E 'TOTAL|FAILED suites' | tr '\n' ';' | \
              { IFS= read -r line; printf '::error::SUITE TALLIES: %s\n' "$line"; }
            exit 1
          fi

  zsh-versions:
    name: Zsh ${{ matrix.image }}
    runs-on: ubuntu-latest
    # Each image brings its own packaged zsh, which is the point:
    #   ubuntu:focal      -> zsh 5.7.1   ubuntu:jammy -> zsh 5.8.1
    #   debian:bookworm   -> zsh 5.9
    #
    # BLOCKING, deliberately, even though all three cells are red right now.
    #
    # What the red actually says, measured 2026-09-26: at v2.3.0 (0fb7ea9) this
    # job split focal+jammy red / bookworm GREEN, and that split was the whole
    # argument — one container image passing while two older ones failed ruled the
    # environment out and left the zsh build as the only variable. bookworm is red
    # too now, at every commit from c14d4bf onward, and all three report only
    # "Process completed with exit code 2" with none of the suite's own lines in
    # the annotations. So the old inference has expired, and the two things this
    # shape is consistent with — a suite that fails assertions, and a suite that
    # never starts — are not yet separated. The step below exists to separate
    # them: rc=2 with no tally is the second one.
    #
    # The job stays red and blocking regardless. A gap on the oldest builds this
    # codebase has never been run on is exactly what it was added to find, and
    # silencing it would put the finding back in the drawer.
    container:
      image: ${{ matrix.image }}
      env:
        # Minimal container images ship with the C locale, which makes grep and
        # awk choke on the Chinese section headers the suites print. Force a
        # UTF-8-capable locale so the text pipeline sees bytes it can match.
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:focal, ubuntu:jammy, debian:bookworm]

    steps:
      - name: Install prerequisites in the container
        run: |
          # Needed BEFORE checkout: the checkout action shells out to git, and
          # it runs inside this container, not on the host.
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git zsh sqlite3 locales python3 procps ncurses-term
          # python3 and procps are test dependencies, not product ones:
          # tests/test-installer-shared.sh parses the installers with a python
          # script, and the installer sandbox's core-tool farm requires `ps` to
          # promise a fixed tool inventory. ubuntu-latest ships both, so a
          # container missing them fails suites that are otherwise green — the
          # exact host-dependence the sandbox farm exists to remove.
          #
          # ncurses-term is the same story one layer down: zsh drops every
          # colour attribute when its terminfo lookup cannot find `setaf`, so a
          # host whose compiled database lacks the requested TERM prints an
          # uncoloured ghost and tests/test-repaint.zsh cannot tell that apart
          # from a plugin that stopped painting it.
          #
          # Minimal images also ship without any locale generated, so the suites'
          # Chinese section headers ("场景 1: …") would be truncated mid-character
          # by grep/awk. Generate the one the job env selects.
          sed -i '/en_US.UTF-8/s/^# //' /etc/locale.gen 2>/dev/null || true
          locale-gen en_US.UTF-8 2>/dev/null || true
          zsh --version

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Complete Test Suite
        id: suite
        shell: bash
        run: |
          # Same trick as the gate job: the log needs authentication to read, the
          # annotations of the check run do not. A red job that nobody can read
          # is just noise, so every failure line goes out twice — once in the
          # log, once as an annotation. The job still fails: the exit code is the
          # suite's own.
          #
          # The output goes to a file as well as to the log, and the rc is
          # recorded as a step output, because the last several reds here said
          # nothing at all: the step exited 2 without emitting one annotation.
          # Only a script that died before its first command can do that -- a
          # process substitution or herestring is parsed when the shell reaches
          # it, so an unsupported one aborts mid-step, and its syntax error lands
          # in the log alone. Everything below is plain pipes, and the step after
          # this one reports what survived.
          set +e
          ./tests/run-all.sh -v > "$RUNNER_TEMP/suite.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/suite.log"
          printf 'rc=%s\n' "$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            # The suites' OWN assertion-failure lines are the whole finding, but
            # they are scattered through ~1700 lines of verbose output, and a
            # check run shows only ~ten annotations. The previous `tail -n 5` over
            # a broad grep kept just the run-all summary and the last suite total,
            # which named exactly one assertion and left the rest to guesswork --
            # and two runs came back byte-identical, because nothing was ever read.
            # So pack every failing assertion into one annotation (they are indented
            # with '| ' by run-all -v, unlike run-all's own summary lines), then the
            # per-suite tallies into another. Plain pipes only, per the note above.
            log="$RUNNER_TEMP/suite.log"
            fails="$(grep -E '\|[[:space:]]+FAIL[[:space:]]' "$log" \
              | sed -E 's/^[[:space:]]*\|[[:space:]]+FAIL[[:space:]]+//; s/[[:space:]]+$//' \
              | cut -c1-90 | tr '\n' ';')"
            printf '::error::FAILING ASSERTIONS: %s\n' "$fails"
            totals="$(grep -E 'TOTAL|FAILED suites' "$log" | tr '\n' ';')"
            printf '::error::SUITE TALLIES: %s\n' "$totals"
          fi
          exit "$rc"

      - name: Report the zsh build and what the suite step left behind
        if: always()
        shell: bash
        run: |
          # The one step that cannot describe itself is the one that never parsed.
          # So report the rc the suite step recorded -- and, when there is none,
          # report that absence, which is itself the finding: the suite step died
          # before it could say anything, and the job's bare "exit code 2" was the
          # whole of its public statement.
          rc="${{ steps.suite.outputs.rc }}"
          [ -n "$rc" ] || rc=never-recorded
          log="$RUNNER_TEMP/suite.log"
          size=0
          [ -f "$log" ] && size="$(wc -c < "$log" | tr -d ' ')"
          printf '::warning::zsh=%s suite rc=%s log_bytes=%s head=[%s]\n' \
            "$(zsh --version 2>&1 | head -n 1)" "$rc" "$size" \
            "$(head -c 110 "$log" 2>/dev/null | tr '\r\n\t' '  ')"

  e2e-advisory:
    name: tmux end-to-end (advisory)
    runs-on: ubuntu-latest
    # NON-BLOCKING. The suite drives a real terminal, so it is the only thing
    # that can see the popup being rendered, a keystroke being eaten, or the
    # screen scrolling under the prompt — all bug classes the unit suites
    # structurally cannot observe (see tests/test-repaint.zsh for why).
    # It is also the only suite that waits on wall-clock timings, so until its
    # flake rate is measured here it must not be allowed to fail a build.
    continue-on-error: true
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh tmux sqlite3 fzf

      - name: Run tmux end-to-end suite
        id: e2e
        run: |
          set +e
          ./tests/e2e-tmux.sh 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          rc=${PIPESTATUS[0]}
          # One annotation line per failure so the result is readable from the
          # API without a job log (same rationale as in the `test` job).
          grep -E 'FAIL|TOTAL|SKIP' "$RUNNER_TEMP/e2e.log" | tail -n 20 | \
            while IFS= read -r line; do
              printf '::warning::%s\n' "$line"
            done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report the advisory verdict
        if: always()
        run: |
          if [ "${{ steps.e2e.outputs.rc }}" = "0" ]; then
            echo "e2e-tmux: green. Candidate for becoming a required check."
          else
            echo "::warning::e2e-tmux failed (rc=${{ steps.e2e.outputs.rc }}) — advisory only, not gating."
          fi
